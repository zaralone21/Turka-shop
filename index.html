<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <script>
    /* Тема до першого показу сторінки: збережений вибір, інакше системна. */
    (function () {
      var t = null; try { t = localStorage.getItem('komfort-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.style.background = t === 'dark' ? '#1C1815' : '#F7F5F1';
    })();
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C1815" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="КОМФОРТ home">
  <title>КОМФОРТ home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>[hidden]{display:none!important}body{margin:0;background:inherit}img{max-width:100%}</style>
</head>
<body>
  <div id="root"><div class="skel" aria-busy="true" aria-label="Завантаження"><i class="h"></i><i class="c"></i><i class="c"></i><i></i><i style="width:70%"></i></div></div>
  <div class="toast-box" id="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
